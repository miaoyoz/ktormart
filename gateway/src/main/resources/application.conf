ktor {
  development = true
  deployment {
    port = 8080 # Gateway runs on the main port 8080
  }
  application {
    modules = [com.ktormart.gateway.ApplicationKt.module]
    serviceName = "gateway"
  }
}

consul {
  host = "localhost"
  port = 8500
}

# Routing rules for our microservices
services {
  user-service {
    path = "/api/v1/users" # Requests starting with this path will be routed
    rewrite = "/users"    # The path will be rewritten to this before forwarding
  }
}

// Resilience4j Circuit Breaker configuration
resilience4j {
  circuitbreaker {
    # Configuration for the circuit breaker protecting user-service
    user-service {
      failureRateThreshold = 50 # 50% of requests failed will open the circuit
      slowCallRateThreshold = 100 # Not used in this example, but good to know
      slowCallDurationThreshold = "2s" # Calls longer than 2s are considered slow
      permittedNumberOfCallsInHalfOpenState = 5 # Allow 5 test requests when half-open
      slidingWindowType = "COUNT_BASED"
      slidingWindowSize = 10 # Consider the last 10 requests
      minimumNumberOfCalls = 10 # Need at least 10 requests before calculating failure rate
      waitDurationInOpenState = "10s" # Wait 10 seconds before transitioning to half-open
    }
  }
}